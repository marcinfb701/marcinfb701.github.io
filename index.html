<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler141 | Szakal701</title>
    <style>
        :root {
            --space-bg: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            --accent: #4cc9f0;
            --glass: rgba(76, 201, 240, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--space-bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width: 90%; 
            max-width: 1200px; 
            padding: 2rem; 
            flex: 1; /* To spycha stopkę na dół */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 { font-size: 4rem; margin-bottom: 0.5rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.2rem; }
        p { font-size: 1.5rem; margin-bottom: 3rem; opacity: 0.8; }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            width: 100%;
            margin-bottom: 5rem;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            border: 2px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            border-radius: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            background: var(--glass);
            transition: all 0.3s ease;
        }

        .btn:hover { background: var(--accent); color: #000; transform: scale(1.05); }
        .btn img { width: 3rem; height: 3rem; margin-right: 1.5rem; }

        .video-section { width: 100%; max-width: 800px; margin-bottom: 3rem; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; border: 2px solid var(--accent); }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        footer { padding: 2rem; opacity: 0.5; text-align: center; }

        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .btn { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Szakal701</h1>
    <p>Fotografia i Kosmiczne Klimaty</p>

    <div class="social-grid">
        <a href="LINK_DO_TWITCH" class="btn"><img src="/images/twitch.svg" alt="Twitch"> Twitch</a>
        <a href="LINK_DO_FB" class="btn"><img src="/images/facebook.svg" alt="Facebook"> Facebook</a>
        <a href="LINK_DO_INSTA" class="btn"><img src="/images/instagram.svg" alt="Instagram"> Instagram</a>
        <a href="LINK_DO_YT" class="btn"><img src="/images/youtube.svg" alt="YouTube"> YouTube</a>
    </div>

    <section class="video-section">
        <h2>Moje najnowsze filmy</h2>
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/videoseries?list=PLai45ECCqPtHeADexHAbxQ7758GsRKPl_" 
                    title="YouTube playlist" frameborder="0" allowfullscreen></iframe>
        </div>
    </section>
</div>

<footer>
    <p>© 2026 Szakal701 | Kosmiczne klimaty</p>
</footer>

</body>
</html>

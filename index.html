        :root {
            --space-bg: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            --accent: #4cc9f0;
            --glass: rgba(76, 201, 240, 0.1);
        }

        body {
            margin: 0; padding: 0; background: var(--space-bg);
            color: white; font-family: 'Segoe UI', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        }

        .container { 
            width: 90%; max-width: 1200px; padding: 2rem; flex: 1;
            display: flex; flex-direction: column; align-items: center;
        }

        /* Sekcja nagłówka (logo obok h1) */
        .header-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .logo-img { width: 60px; }
        h1 { font-size: 3.5rem; margin: 0; color: var(--accent); text-transform: uppercase; }
        
        .profile-img { 
            width: 200px; height: 200px; border-radius: 50%; 
            border: 4px solid var(--accent); margin: 1.5rem 0;
            object-fit: cover; box-shadow: 0 0 20px rgba(76, 201, 240, 0.3);
        }
        p { font-size: 1.5rem; margin-bottom: 3rem; opacity: 0.8; }

        /* Przyciski */
        .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; width: 100%; margin-bottom: 5rem; }
        .btn {
            display: flex; align-items: center; justify-content: center; padding: 1.2rem;
            border: 2px solid var(--accent); color: var(--accent); text-decoration: none;
            border-radius: 1rem; font-size: 1.2rem; font-weight: bold;
            background: var(--glass); transition: all 0.3s ease;
        }
        .btn img { width: 2rem; height: 2rem; margin-right: 1rem; }
        
        /* Indywidualne kolory przycisków */
        .btn-twitch:hover { background: #9146FF; border-color: #9146FF; color: white; }
        .btn-fb:hover { background: #1877F2; border-color: #1877F2; color: white; }
        .btn-yt:hover { background: #FF0000; border-color: #FF0000; color: white; }

            border-color: #e1306c; 
            color: white;

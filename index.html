<!DOCTYPE html>
<html lang="pl">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kepler141 | Wirtualna Wizytówka</title>
    <style>
        :root {
            --space-bg: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            --accent: #4cc9f0;
            --glass: rgba(76, 201, 240, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--space-bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container { width: 90%; max-width: 1200px; padding: 2rem; }
        
        h1 { font-size: 4rem; margin-bottom: 0.5rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.2rem; }
        p { font-size: 1.5rem; margin-bottom: 3rem; opacity: 0.8; }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 2rem;
            margin: 0 auto;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            border: 2px solid var(--accent);
            color: var(--accent);
            text-decoration: none;
            border-radius: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            background: var(--glass);
            transition: all 0.3s ease;
        }

        .btn:hover { background: var(--accent); color: #000; transform: scale(1.05); }

        .btn img { width: 3rem; height: 3rem; margin-right: 1.5rem; }

        .fb-section { margin-top: 5rem; width: 100%; }
        .widget-container { margin: 2rem auto; min-height: 300px; }

        /* Responsywność dla telefonów */
        @media (max-width: 600px) {
            h1 { font-size: 2.5rem; }
            .btn { padding: 1.2rem; font-size: 1.2rem; }
            .btn img { width: 2rem; height: 2rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Kepler141</h1>
    <p>Fotografia i Kosmiczne Klimaty</p>

    <div class="social-grid">
        <a href="LINK_DO_TWITCH" class="btn">
            <img src="/images/twitch.svt" alt="Twitch"> Twitch
        </a>
        <a href="LINK_DO_FB" class="btn">
            <img src="/images/facebook.svt" alt="Facebook"> Facebook
        </a>
        <a href="LINK_DO_INSTA" class="btn">
            <img src="/images/instagram.svt" alt="Instagram"> Instagram
        </a>
        <a href="LINK_DO_YT" class="btn">
            <img src="/images/youtube.svt" alt="YouTube"> YouTube
        </a>
    </div>

    <div class="fb-section">
        <h2>Ostatnie kadry</h2>
        <div class="widget-container">
            
            </div>
    </div>
</div>

</body>
</html>
